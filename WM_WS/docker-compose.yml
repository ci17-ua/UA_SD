# =========================================================
# PC DEL LABORATORIO CON LAS ESTACIONES (WM_WS): 20 ESTACIONES, CADA UNA ES UN MONITOR + UN ENGINE
# Se lanza desde esta carpeta (WM_WS). Central y Kafka estan en AWS: sus direcciones van en el fichero .env
#   docker compose up -d --build                         (las 20 estaciones)
#   docker compose up -d --build monitor-ws01 engine-ws01 monitor-ws02 engine-ws02   (solo algunas)
#   docker compose ps                                    (que esta en marcha)
#   docker compose logs -f monitor-ws01                  (lo que muestra un Monitor)
#   docker attach engine-ws01                            (menu de un Engine; salir sin pararlo: Ctrl+P y despues Ctrl+Q)
#   docker compose stop engine-ws03                      (caida de un Engine; docker compose start engine-ws03 para volver)
#   docker compose down                                  (parar y quitar todo; los riegos a medias se quedan en el volumen)
# =========================================================

# LO QUE TIENEN EN COMUN TODOS LOS MONITORS Y TODOS LOS ENGINES (CADA SERVICIO LO COPIA CON <<: *monitor O <<: *engine)
# JAVA_TOOL_OPTIONS LIMITA LA MEMORIA DE CADA JAVA: CON 40 PROGRAMAS EN EL MISMO PC, SIN LIMITE PODRIAN RESERVAR DEMASIADA
x-monitor: &monitor
  build: ./WS_M
  image: wm-ws-monitor
  environment:
    JAVA_TOOL_OPTIONS: "-Xmx64m -XX:+UseSerialGC"
    WM_TRAMAS_ERROR: ${WM_TRAMAS_ERROR:-0}     # PROBABILIDAD DE TRAMA CON EL LRC MAL (DEMOSTRACION DE NACK)


x-engine: &engine
  build: ./WS_E
  image: wm-ws-engine
  environment:
    JAVA_TOOL_OPTIONS: "-Xmx128m -XX:+UseSerialGC"
    WM_TRAMAS_ERROR: ${WM_TRAMAS_ERROR:-0}
  volumes:
    - riegos:/data                  # WM_RIEGO_DIR=/data (lo fija el Dockerfile): riego-<ID>.txt de cada Engine
  stdin_open: true                  # el Engine tiene menu: hace falta para docker attach
  tty: true

services:

  # ---------- ESTACION WS-01 ----------
  monitor-ws01:
    <<: *monitor
    container_name: monitor-ws01
    # puerto_escucha_motor IP_central puerto_central ID_estacion ubicacion
    command: ["5000", "${CENTRAL_HOST}", "${CENTRAL_PUERTO}", "WS-01", "Parque Norte"]

  engine-ws01:
    <<: *engine
    container_name: engine-ws01
    # IP_kafka puerto_kafka IP_monitor puerto_monitor (el Monitor esta en este compose: se le llama por su nombre)
    command: ["${KAFKA_HOST}", "${KAFKA_PUERTO}", "monitor-ws01", "5000"]

