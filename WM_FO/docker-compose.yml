
# =========================================================
# PC DEL LABORATORIO CON LOS OPERARIOS (WM_FO): 20 OPERARIOS QUE LEEN SUS PETICIONES DE UN FICHERO (PRUEBA BASE, SIN INTERACCION)
# Se lanza desde esta carpeta (WM_FO). Kafka esta en AWS: su direccion va en el fichero .env
#   docker compose up -d --build                         (los 20 operarios)
#   docker compose up -d --build fo-op01 fo-op02         (solo algunos)
#   docker compose logs -f fo-op01                       (lo que ve un operario)
#   docker compose run --rm fo-menu                      (un operario mas, OP99, con menu por teclado)
# Cada operario lee peticiones/opXX.txt: una linea ID_ESTACION#DURACION por riego. Al acabar el fichero, su FO se cierra
# =========================================================

# LO QUE TIENEN EN COMUN TODOS LOS OPERARIOS
x-fo: &fo
  build: .
  image: wm-fo
  environment:
    JAVA_TOOL_OPTIONS: "-Xmx128m -XX:+UseSerialGC"
  volumes:
    - ./peticiones:/peticiones      # la carpeta peticiones de este PC, montada dentro

services:

  fo-op01:
    <<: *fo
    container_name: fo-op01
    # IP_kafka puerto_kafka ID_operario fichero_peticiones (ruta DENTRO del contenedor)
    command: ["${KAFKA_HOST}", "${KAFKA_PUERTO}", "OP01", "/peticiones/op01.txt"]

